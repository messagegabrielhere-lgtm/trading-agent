name: Run paper agent

on:
  schedule:
    - cron: "30 21 * * 1-5" # weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency: agent

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m agent.run
      - name: Commit dashboard data
        run: |
          git config user.name "paper-agent"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daily paper run"
          git push
