name: Run paper agent

on:
  schedule:
    - cron: "30 21 * * 1-5" # weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: agent

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m agent.run
      - name: Open an issue for new tickets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python -m agent.notify > ticket.md
          if [ -s ticket.md ]; then
            gh issue create --title "$(head -1 ticket.md)" --body "$(tail -n +3 ticket.md)" \
              --assignee "${{ github.repository_owner }}"
          fi
          rm ticket.md
      - name: Commit dashboard data
        run: |
          git config user.name "paper-agent"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "Daily paper run"
          git push
