name: Trade paper account

# Mirrors the strategy's targets into the Alpaca paper account during market hours.
# Needs repository secrets ALPACA_KEY_ID and ALPACA_SECRET_KEY (paper keys).
# Checks every 15 minutes while US markets can be open (13:30-21:00 UTC covers both EDT and EST;
# the bot itself skips when Alpaca says the market is closed). It trades only when the account has
# drifted from the strategy's targets, so most checks place no orders.
on:
  schedule:
    - cron: "*/15 13-20 * * 1-5"
  push:
    branches: [main]
    paths: [".github/workflows/trade.yml", "agent/broker.py", "config.json"]
  workflow_dispatch:

permissions:
  contents: write

concurrency: agent

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sync the Alpaca paper account
        env:
          ALPACA_KEY_ID: ${{ secrets.ALPACA_KEY_ID }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: python -m agent.broker
      - name: Commit account data
        if: always()
        run: |
          git config user.name "paper-agent"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/broker.json
          git diff --cached --quiet && exit 0
          git commit -m "Paper account sync"
          git pull --rebase -q && git push
